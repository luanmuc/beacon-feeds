name: probe-live

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "live/sources.txt"
      - "scripts/probe_live.py"
      - "scripts/build_config.py"
      - "scripts/build_manifest.py"
      - "config/base.json"

permissions:
  contents: write

concurrency:
  group: source-write
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe live sources
        run: python3 scripts/probe_live.py --input live/sources.txt --out live/all.m3u --report live/report.json
      - name: Build tvbox.json
        env:
          RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/stable
        run: python3 scripts/build_config.py
      - name: Build manifest and live report
        run: |
          set -e
          python3 scripts/build_manifest.py --tvbox tvbox.json --report live/report.json --alive config/sites.alive.json --dead config/sites.dead.json --out manifest.json
          if [ -f live/all.m3u ]; then cp live/all.m3u live.m3u; fi
          cp live/report.json live-report.json
      - name: Commit and move stable tag
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live tvbox.json live.m3u manifest.json live-report.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(live): probe $(date -u +%F_%H:%M)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          else
            echo "no change"
          fi
          git push -f origin HEAD:refs/heads/stable

      - name: Build health page
        run: python3 scripts/build_health.py
      - name: Commit health page
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -q -m "docs: 源健康 $(date -u +%F_%H:%M)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
