name: probe-live

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "live/sources.txt"
      - "scripts/probe_live.py"
      - "scripts/build_config.py"
      - "config/base.json"

permissions:
  contents: write

concurrency:
  group: source-write
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe live sources
        run: python3 scripts/probe_live.py --input live/sources.txt --out live/all.m3u --report live/report.json
      - name: Build tvbox.json
        env:
          RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}
        run: python3 scripts/build_config.py
      - name: Commit if changed
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live tvbox.json
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "chore(live): probe $(date -u +%F_%H:%M)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push

        env:
          TOKEN: ${{ secrets.TV_SEED_TOKEN }}
        run: |
          set -e
          cd /tmp && rm -rf seed
          git clone -q "https://x-access-token:${TOKEN}@github.com/luanmuc/beacon-seed.git" seed
          cp "$GITHUB_WORKSPACE/tvbox.json" seed/tvbox.json
          if [ -f "$GITHUB_WORKSPACE/live/all.m3u" ]; then cp "$GITHUB_WORKSPACE/live/all.m3u" seed/live.m3u; fi
          cd seed
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "seed unchanged"; exit 0; fi
          git commit -q -m "sync: $(date -u +%F_%H:%M)"
          git push -q

      - name: Build health page
        run: |
          python3 - <<'PYEOF'
import json, html, pathlib, datetime
rep = {}
for f in ("live/report.json", "vod/report.json"):
    p = pathlib.Path(f)
    if p.exists():
        try: rep[f] = json.loads(p.read_text())
        except Exception: rep[f] = {}
def rows(obj):
    out = []
    if isinstance(obj, dict):
        for k, v in obj.items():
            if isinstance(v, dict):
                out.append((k, v.get("ok", v.get("status", "")), v.get("latency", v.get("ms", ""))))
    elif isinstance(obj, list):
        for v in obj:
            if isinstance(v, dict):
                out.append((v.get("name", v.get("url", "")), v.get("ok", v.get("status", "")), v.get("latency", v.get("ms", ""))))
    return out
body = []
for f, obj in rep.items():
    body.append(f"<h2>{html.escape(f)}</h2><table><tr><th>源</th><th>状态</th><th>延迟</th></tr>")
    for n, ok, lat in rows(obj)[:200]:
        body.append(f"<tr><td>{html.escape(str(n))}</td><td>{html.escape(str(ok))}</td><td>{html.escape(str(lat))}</td></tr>")
    body.append("</table>")
page = f"""<!doctype html><html><head><meta charset="utf-8"><title>源健康</title>
<style>body{{font-family:system-ui;margin:24px}}table{{border-collapse:collapse;width:100%}}td,th{{border:1px solid #ddd;padding:6px;font-size:13px}}th{{background:#f6f6f6}}</style>
</head><body><h1>源健康报告</h1><p>生成时间：{datetime.datetime.utcnow():%Y-%m-%d %H:%M UTC}</p>{''.join(body)}</body></html>"""
pathlib.Path("docs").mkdir(exist_ok=True)
pathlib.Path("docs/index.html").write_text(page, encoding="utf-8")
PYEOF
      - name: Commit health page
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -q -m "docs: 源健康 $(date -u +%F_%H:%M)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
