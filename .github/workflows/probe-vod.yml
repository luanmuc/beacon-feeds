name: probe-vod

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "config/sites.json"
      - "scripts/probe_vod.py"
      - "scripts/build_config.py"
      - "scripts/build_manifest.py"

permissions:
  contents: write

concurrency:
  group: source-write
  cancel-in-progress: false

jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe VOD sites
        run: python3 scripts/probe_vod.py --input config/sites.json --alive config/sites.alive.json --dead config/sites.dead.json
      - name: Build runtime source lists
        run: python3 scripts/build_sources.py
      - name: Build tvbox.json
        env:
          RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/release
        run: python3 scripts/build_config.py
      - name: Build manifest and live report
        run: |
          set -e
          python3 scripts/build_manifest.py --tvbox tvbox.json --report live/report.json --alive config/sites.alive.json --dead config/sites.dead.json --out manifest.json
          if [ -f live/all.m3u ]; then cp live/all.m3u live.m3u; fi
          if [ -f live/report.json ]; then cp live/report.json live-report.json; fi
      - name: Commit and move release branch
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config tvbox.json vod-sites.json manifest.json live.m3u
          if [ -f live-report.json ]; then git add live-report.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "chore(vod): probe $(date -u +%F) [skip ci]"
            git fetch origin "${GITHUB_REF_NAME}"
            git merge -Xtheirs --no-edit FETCH_HEAD
            git push
          else
            echo "no change"
          fi
          git push -f origin HEAD:refs/heads/release
