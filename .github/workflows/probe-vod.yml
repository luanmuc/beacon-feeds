name: probe-vod

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:
  push:
    paths:
      - "config/sites.json"
      - "scripts/probe_vod.py"

permissions:
  contents: write

concurrency:
  group: source-write
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe VOD sites
        run: python3 scripts/probe_vod.py --input config/sites.json --alive config/sites.alive.json --dead config/sites.dead.json
      - name: Build tvbox.json
        env:
          RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}
        run: python3 scripts/build_config.py
      - name: Commit if changed
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config tvbox.json
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "chore(vod): probe $(date -u +%F)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
